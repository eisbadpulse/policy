<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eisbad Pulse Watch App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 30px;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #b0b0b0;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .btn {
      display: inline-block;
      background-color: #0070f3;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0051a2;
    }
    .hint {
      font-size: 12px;
      color: #888888;
      margin-top: 25px;
      border-top: 1px solid #2a2a2a;
      padding-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Eisbad Pulse Watch App</h1>
    <p>Klicke auf den Button, um die Watch-App im Web-Play-Store aufzurufen.</p>
    
    <a href="https://play.google.com/store/apps/details?id=com.eisbadpulse.app" target="_blank" rel="noopener noreferrer" class="btn">
      Im Web-Play-Store öffnen
    </a>
    
    <div class="hint">
      <strong>Hinweis:</strong> Sollte dein Handy trotz des Klicks die native Play-Store-App öffnen, tippe oben rechts im Browser-Menü auf die drei Punkte und aktiviere die Option <strong>"Desktop-Website"</strong>.
    </div>
  </div>
</body>
</html>
